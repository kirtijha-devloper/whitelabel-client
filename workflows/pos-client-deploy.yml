name: Deploy POS Client

on:
  push:
    branches:
      - main   # or Dev2 if needed

jobs:
  deploy:
    if: github.repository == 'Abheepay-POS/pos-client'
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "📂 Go to project directory"
            cd /var/www/pos.abheepay.com/pos-client

            echo "🔄 Pull latest code"
            git fetch origin
            git reset --hard origin/main

            echo "⚙️ Load NVM"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "🟢 Use Node"
            nvm use --lts || nvm install --lts

            echo "📦 Install dependencies"
            npm ci

            echo "🏗️ Build project"
            npm run build


            echo "✅ Deployment completed"
