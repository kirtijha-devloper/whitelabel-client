name: Deploy POS Client - Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    if: github.repository == 'Abheepay-POS/pos-client'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/pos-staging.abheepay.com/pos-client
            git fetch origin
            git reset --hard origin/staging
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use --lts || nvm install --lts
            chown -R $USER:$USER /var/www/pos-staging.abheepay.com/pos-client
            npm ci
            npm run build
            chown -R $USER:$USER dist
            chmod -R 755 dist
            echo "Staging client deployed"
